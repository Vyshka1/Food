# Приложение и служба на одном адресе, внутри контейнера.
#
# Ни сертификата, ни имени сайта здесь нет: и то и другое — забота Traefik,
# который стоит перед этим контейнером. Здесь только раздача файлов и передача
# /api/ службе.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://food-extract:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ходить по чужой ссылке может быть долго, особенно через yt-dlp
        proxy_read_timeout 60s;
    }

    # Файлы сборки названы по содержимому: имя меняется вместе с содержимым,
    # поэтому их можно держать в кэше сколько угодно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # А эти два — никогда. Страница и служебный воркер решают, какая версия
    # приложения открылась: закэшируй их — и обновление не дойдёт до человека.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 1m;
}
